# fly.toml app configuration file
app = "taska-3zwqeq"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Sinkronkan schema sebelum instance baru start.
  release_command = "pnpm --filter api exec prisma db push --config prisma7.config.ts"
  release_command_timeout = "10m"

[env]
  PORT = "3000"
  UPLOAD_DIR = "/app/apps/api/uploads"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

